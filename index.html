<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RC Espetinho • Comandas Central</title><style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#24221f;--muted:#746f67;--line:#e4dfd7;--accent:#b33b24;--ok:#218c55;--warn:#b77b14;--bad:#b33232;--blue:#2769a8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px max(12px,calc((100vw - 1180px)/2));}.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900;font-size:21px}.brand span{color:var(--accent)}.user{font-size:12px;color:var(--muted)}.nav{display:flex;gap:6px;margin-top:10px;overflow:auto}.nav button{background:#eee9e1;padding:9px 13px;border-radius:10px;white-space:nowrap}.nav .active{background:var(--ink);color:#fff}.wrap{max-width:1180px;margin:auto;padding:16px 12px 60px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.table{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;min-height:125px;text-align:left;box-shadow:0 2px 7px #00000008}.table h3{margin:0 0 8px}.status{font-weight:800;font-size:12px}.livre{color:var(--ok)}.ocupada{color:var(--bad)}.aguardando{color:var(--warn)}.fechada{color:var(--blue)}.money{font-weight:900;font-size:20px;margin-top:10px}.muted{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 13px;border-radius:10px;background:#eee9e1}.primary{background:var(--accent);color:#fff}.success{background:var(--ok);color:#fff}.danger{background:var(--bad);color:#fff}.blue{background:var(--blue);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{font-size:23px}.stickyPay{position:sticky;top:78px;z-index:8;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pay{border:1px solid var(--line);border-radius:11px;padding:9px}.pay b{display:block}.item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.item:last-child{border-bottom:0}.badge{display:inline-block;padding:4px 7px;border-radius:99px;background:#eee9e1;font-size:11px}.form{display:grid;gap:7px;margin-top:10px}.form input,.form select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modalbg{position:fixed;inset:0;background:#0007;z-index:50;display:grid;place-items:center;padding:15px}.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:18px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:11px 15px;border-radius:99px;z-index:100}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{max-width:390px;width:100%;background:#fff;padding:24px;border-radius:18px;border:1px solid var(--line)}h1,h2,h3{margin-top:0}.table small{display:block;margin-top:4px;color:var(--muted)}@media(max-width:650px){.paygrid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.stickyPay{top:74px}.grid{grid-template-columns:repeat(2,1fr)}.item{grid-template-columns:1fr auto}.item .item-actions{grid-column:1/-1}.actions .btn{flex:1}}
</style></head><body><div id="app"></div><script src="/socket.io/socket.io.js"></script><script>
let token=localStorage.getItem('rc_token'), me=JSON.parse(localStorage.getItem('rc_user')||'null'), view='mesas', tables=[],products=[],current=null;
const api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(path,opt);let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.error||'Erro no servidor');return j};
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); const toast=m=>{const x=document.createElement('div');x.className='toast';x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)};
function login(){document.getElementById('app').innerHTML='<div class="login"><div class="loginbox"><h1>RC <span style="color:var(--accent)">Espetinho</span></h1><p class="muted">Sistema central de comandas</p><div class="form"><input id="u" placeholder="Usuário" autocomplete="username"><input id="p" type="password" placeholder="Senha" autocomplete="current-password"><button class="btn primary" id="go">ENTRAR</button></div><p class="muted" style="font-size:12px">Primeiro acesso de demonstração: admin / Admin@123</p></div></div>';go.onclick=async()=>{try{const x=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:u.value,password:p.value})});token=x.token;me=x.user;localStorage.setItem('rc_token',token);localStorage.setItem('rc_user',JSON.stringify(me));boot()}catch(e){toast(e.message)}}}
async function boot(){if(!token||!me)return login();try{await api('/api/me')}catch{localStorage.clear();token=null;return login()}await refresh();render();const s=io();s.on('state:changed',async()=>{await refresh();if(view==='mesas')render()});}
async function refresh(){[tables,products]=await Promise.all([api('/api/tables'),api('/api/products')])}
function shell(){document.getElementById('app').innerHTML=`<div class="top"><div class="toprow"><div class="brand">RC <span>Espetinho</span></div><div><b>${me.name}</b><div class="user">${me.role}</div></div></div><div class="nav">${nav('mesas','Mesas')}${(me.role==='ADMIN'||me.role==='CAIXA')?nav('dashboard','Painel'):''}${me.role==='ADMIN'?nav('produtos','Produtos'):''}${me.role==='ADMIN'?nav('usuarios','Usuários'):''}${(me.role==='ADMIN'||me.role==='CAIXA')?nav('relatorios','Relatórios'):''}${(me.role==='ADMIN'||me.role==='CAIXA')?nav('historico','Histórico'):''}${me.role==='ADMIN'?nav('auditoria','Auditoria'):''}<button onclick="logout()">Sair</button></div></div><main class="wrap" id="main"></main>`;document.querySelectorAll('.nav button[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()})}
function nav(v,t){return `<button data-v="${v}" class="${view===v?'active':''}">${t}</button>`}function logout(){localStorage.clear();location.reload()}
function render(){shell();if(view==='mesas')renderTables();else if(view==='dashboard')dashboard();else if(view==='produtos')productsView();else if(view==='usuarios')usersView();else if(view==='relatorios')reportsView();else if(view==='historico')historyView();else auditView()}
function renderTables(){const m=document.getElementById('main');const mine=me.role==='GARCOM'?tables.filter(t=>t.waiter_id===me.id||t.status==='LIVRE'):tables;m.innerHTML=`<div class="row"><div><h2>Mesas</h2><p class="muted">Servidor central • atualização automática</p></div>${me.role!=='GARCOM'?'<button class="btn primary" onclick="openNew()">+ ABRIR MESA</button>':''}</div><div class="grid">${mine.map(t=>`<button class="table" onclick="${t.order_id?`openOrder('${t.order_id}')`:t.status==='LIVRE'?`openNew('${t.id}')`:''}"><h3>Mesa ${t.number}</h3><div class="status ${t.status.toLowerCase().replace('_','')}">${t.status==='LIVRE'?'🟢 LIVRE':t.status==='OCUPADA'?'🔴 OCUPADA':t.status==='AGUARDANDO_PAGAMENTO'?'🟡 PAGAMENTO':'🔵 FECHADA'}</div><small>${t.waiter||'Sem garçom'}</small>${t.order_id?`<div class="money">${money(t.total)}</div><small>Pago ${money(t.paid)} • Restante ${money(Math.max(0,t.total-t.paid))}</small>`:''}</button>`).join('')}</div>`}
async function openNew(pre){const free=tables.filter(t=>t.status==='LIVRE');if(!free.length)return toast('Não há mesas livres.');let tid=pre||free[0].id;let waiter_id=me.id;if(me.role!=='GARCOM'){const us=await api('/api/users');const gs=us.filter(x=>x.role==='GARCOM'&&x.active);const name=prompt('Digite o usuário do garçom responsável (ou deixe vazio para Caixa):');const w=gs.find(x=>x.username===name);if(w)waiter_id=w.id}try{const o=await api('/api/tables/'+tid+'/open',{method:'POST',body:JSON.stringify({waiter_id})});openOrder(o.id)}catch(e){toast(e.message)}}
async function openOrder(id){try{current=await api('/api/tables/'+id+'/order');view='order';renderOrder()}catch(e){toast(e.message)}}
function renderOrder(){shell();const m=document.getElementById('main'),o=current,paid=Number(o.paid),rem=Number(o.remaining);m.innerHTML=`<div class="stickyPay"><div class="row"><div><b>Mesa ${o.table_number}</b><div class="muted">${o.waiter} • aberta ${new Date(o.opened_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div></div><div style="text-align:right"><div>Total <b>${money(o.total)}</b></div><div>Pago <b>${money(paid)}</b> • Restante <b>${money(rem)}</b></div></div></div><div class="actions" style="margin-top:10px"><button class="btn blue" onclick="addPayment()">RECEBER PAGAMENTO</button>${(me.role==='ADMIN'||me.role==='CAIXA')?'<button class="btn" onclick="adjustOrder()">AJUSTES</button><button class="btn" onclick="transferOrder()">TRANSFERIR</button>':''}<button class="btn ${rem<.01?'success':'primary'}" onclick="closeOrder()">${rem<.01?'✓ FECHAR MESA':'PAGAMENTO PARCIAL'}</button><button class="btn" onclick="view='mesas';render()">Voltar</button></div></div><div class="card"><h3>Pedidos</h3>${o.items.length?o.items.map(i=>`<div class="item"><div><b>${i.quantity}× ${i.product_name}</b><small>${money(i.unit_price)} cada ${i.status==='CANCELADO'?'<span class="badge">CANCELADO</span>':''}</small></div><b>${money(i.unit_price*i.quantity)}</b><div class="item-actions">${i.status==='ATIVO'?`<button class="btn" onclick="cancelItem('${i.id}')">Cancelar</button>`:''}</div></div>`).join(''):'<p class="muted">Nenhum item.</p>'}</div><div class="card"><h3>Adicionar pedido</h3><div class="form"><select id="prod">${products.filter(p=>p.active).map(p=>`<option value="${p.id}">${p.name} — ${money(p.price)}</option>`).join('')}</select><input id="qty" type="number" min="0.001" step="0.001" value="1"><button class="btn primary" onclick="addItem()">ADICIONAR</button></div></div><div class="card"><h3>Pagamentos</h3>${o.payments.length?o.payments.map(p=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${p.method}<small>${new Date(p.created_at).toLocaleTimeString('pt-BR')} • ${p.created_by_name}</small></span><b>${money(p.amount)} ${(me.role==='ADMIN'||me.role==='CAIXA')?`<button class="btn" onclick="removePayment('${p.id}')">Estornar</button>`:''}</b></div>`).join(''):'<p class="muted">Nenhum pagamento.</p>'}</div>`}
async function reloadOrder(){current=await api('/api/tables/'+current.id+'/order');renderOrder()}
async function addItem(){try{await api('/api/orders/'+current.id+'/items',{method:'POST',body:JSON.stringify({product_id:prod.value,quantity:Number(qty.value)})});await reloadOrder()}catch(e){toast(e.message)}}
async function cancelItem(id){if(!confirm('Cancelar este item?'))return;try{await api('/api/order-items/'+id,{method:'PATCH',body:JSON.stringify({status:'CANCELADO'})});await reloadOrder()}catch(e){toast(e.message)}}
async function addPayment(){const method=prompt('Forma de pagamento (Dinheiro, PIX, Débito, Crédito, Vale/Outra):','PIX');if(!method)return;const amount=prompt('Valor recebido:',Number(current.remaining).toFixed(2));if(!amount)return;try{await api('/api/orders/'+current.id+'/payments',{method:'POST',body:JSON.stringify({method,amount:Number(amount)})});await reloadOrder()}catch(e){toast(e.message)}}
async function adjustOrder(){const d=prompt('Desconto (R$)',Number(current.discount||0).toFixed(2));if(d===null)return;const a=prompt('Acréscimos (R$)',Number(current.additions||0).toFixed(2));if(a===null)return;const s=prompt('Taxa de serviço (R$)',Number(current.service_fee||0).toFixed(2));if(s===null)return;try{await api('/api/orders/'+current.id+'/financials',{method:'PATCH',body:JSON.stringify({discount:Number(d),additions:Number(a),service_fee:Number(s)})});await reloadOrder()}catch(e){toast(e.message)}}
async function transferOrder(){const free=tables.filter(t=>t.status==='LIVRE');if(!free.length)return toast('Nenhuma mesa livre.');const n=prompt('Número da mesa de destino:\n'+free.map(t=>t.number).join(', '));if(!n)return;const t=free.find(x=>String(x.number)===String(n));if(!t)return toast('Mesa inválida.');try{await api('/api/orders/'+current.id+'/transfer',{method:'POST',body:JSON.stringify({table_id:t.id})});toast('Mesa transferida.');await reloadOrder()}catch(e){toast(e.message)}}
async function removePayment(id){if(!confirm('Estornar este pagamento?'))return;try{await api('/api/payments/'+id,{method:'DELETE'});await reloadOrder()}catch(e){toast(e.message)}}
async function closeOrder(){if(Number(current.remaining)>.009)return addPayment();if(!confirm('Confirmar fechamento da mesa?'))return;try{await api('/api/orders/'+current.id+'/close',{method:'POST'});toast('Mesa fechada e liberada.');view='mesas';await refresh();render()}catch(e){toast(e.message)}}
async function dashboard(){const d=await api('/api/dashboard');document.getElementById('main').innerHTML=`<h2>Painel central</h2><div class="stats">${d.tables.map(x=>`<div class="stat"><span>${x.status}</span><br><b>${x.n}</b></div>`).join('')}<div class="stat"><span>Vendas hoje</span><br><b>${money(d.sales.total)}</b></div><div class="stat"><span>Mesas fechadas</span><br><b>${d.sales.tables}</b></div></div><div class="card"><h3>Recebimentos</h3>${d.payments.map(p=>`<div class="row"><span>${p.method}</span><b>${money(p.total)}</b></div>`).join('')}</div><div class="card"><h3>Por garçom</h3>${d.waiters.map(w=>`<div class="row"><span>${w.name}<small>${w.tables} mesas</small></span><b>${money(w.total)}</b></div>`).join('')}</div>`}
async function productsView(){const m=document.getElementById('main');m.innerHTML='<div class="row"><h2>Produtos</h2><button class="btn primary" onclick="newProduct()">+ PRODUTO</button></div><div class="card">'+products.map(p=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span><b>${p.name}</b><small>${p.category||'Sem categoria'} • ${p.active?'Ativo':'Inativo'}</small></span><span><b>${money(p.price)}</b> <button class="btn" onclick="editProduct('${p.id}')">Editar</button></span></div>`).join('')+'</div>'} 
async function newProduct(){const name=prompt('Nome do produto');if(!name)return;const price=prompt('Preço');const category=prompt('Categoria','Espetinhos');try{await api('/api/products',{method:'POST',body:JSON.stringify({name,price:Number(price),category})});products=await api('/api/products');productsView()}catch(e){toast(e.message)}}async function editProduct(id){const p=products.find(x=>x.id===id);const price=prompt('Novo preço',p.price);const active=confirm('Produto ativo? OK=sim, Cancelar=não');try{await api('/api/products/'+id,{method:'PATCH',body:JSON.stringify({price:Number(price),active})});products=await api('/api/products');productsView()}catch(e){toast(e.message)}}
async function usersView(){const us=await api('/api/users');document.getElementById('main').innerHTML=`<div class="row"><h2>Usuários</h2><button class="btn primary" onclick="newUser()">+ USUÁRIO</button></div><div class="card">${us.map(u=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span><b>${u.name}</b><small>${u.username} • ${u.role} • ${u.active?'Ativo':'Inativo'}</small></span><button class="btn" onclick="toggleUser('${u.id}',${u.active})">${u.active?'Desativar':'Ativar'}</button></div>`).join('')}</div>`}async function newUser(){const name=prompt('Nome');if(!name)return;const username=prompt('Usuário');const password=prompt('Senha');const role=prompt('Função: ADMIN, CAIXA ou GARCOM','GARCOM').toUpperCase();try{await api('/api/users',{method:'POST',body:JSON.stringify({name,username,password,role})});usersView()}catch(e){toast(e.message)}}async function toggleUser(id,a){try{await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({active:!a})});usersView()}catch(e){toast(e.message)}}
async function reportsView(){document.getElementById('main').innerHTML='<h2>Relatórios</h2><div class="card"><div class="two"><input id="rf" type="date" value="'+new Date().toISOString().slice(0,10)+'"><input id="rt" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><button class="btn primary" style="margin-top:8px" onclick="loadReport()">CONSULTAR</button></div><div id="report"></div>'}async function loadReport(){const r=await api('/api/reports?from='+rf.value+'&to='+rt.value);report.innerHTML=`<div class="stats"><div class="stat">Mesas<br><b>${r.sales.tables}</b></div><div class="stat">Faturamento<br><b>${money(r.sales.revenue)}</b></div><div class="stat">Ticket médio<br><b>${money(r.sales.ticket)}</b></div></div><div class="card"><h3>Formas de pagamento</h3>${r.methods.map(x=>`<div class="row"><span>${x.method}</span><b>${money(x.total)}</b></div>`).join('')}</div><div class="card"><h3>Produtos mais vendidos</h3>${r.products.map(x=>`<div class="row"><span>${x.product_name}</span><b>${x.quantity}</b></div>`).join('')}</div>`}
async function historyView(){document.getElementById('main').innerHTML='<h2>Histórico de vendas</h2><div class="card"><div class="two"><input id="hf" type="date" value="'+new Date().toISOString().slice(0,10)+'"><input id="ht" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><button class="btn primary" style="margin-top:8px" onclick="loadHistory()">CONSULTAR</button></div><div id="hist"></div>';loadHistory()}async function loadHistory(){try{const r=await api('/api/history?from='+hf.value+'&to='+ht.value);hist.innerHTML='<div class="card">'+(r.length?r.map(x=>`<div style="padding:11px 0;border-bottom:1px solid var(--line)"><div class="row"><span><b>Mesa ${x.table_number}</b> • ${x.waiter}</span><b>${money(x.total)}</b></div><small>${new Date(x.closed_at).toLocaleString('pt-BR')} • Pago ${money(x.paid)} • Desconto ${money(x.discount)}</small></div>`).join(''):'<p class="muted">Nenhuma venda no período.</p>')+'</div>'}catch(e){toast(e.message)}}
async function auditView(){const a=await api('/api/audit');document.getElementById('main').innerHTML='<h2>Auditoria</h2><div class="card">'+a.map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${x.action}</b> • ${x.actor_name||'Sistema'}<small>${new Date(x.created_at).toLocaleString('pt-BR')} • Mesa ${x.table_number||'-'}</small></div>`).join('')+'</div>'}
boot();
</script></body></html>
